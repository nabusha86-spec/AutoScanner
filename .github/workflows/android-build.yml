name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Check app dependencies
        run: ./gradlew --no-daemon :app:dependencies --configuration debugCompileClasspath

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscanner-trader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Build signed release APK
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_HOME}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Prepare release signing key
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64" || { echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_RELEASE_STORE_PASSWORD" || { echo "Missing ANDROID_RELEASE_STORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_ALIAS" || { echo "Missing ANDROID_RELEASE_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_RELEASE_KEY_PASSWORD" || { echo "Missing ANDROID_RELEASE_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoscanner-release.p12"
          test -s "$RUNNER_TEMP/autoscanner-release.p12"
          echo "ANDROID_RELEASE_STORE_FILE=$RUNNER_TEMP/autoscanner-release.p12" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BADGING=$("${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -q "^package: name='com.autoscanner.trader' versionCode='6' versionName='0.2.4'"
          if "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q '^application-debuggable'; then
            echo "Release APK must not be debuggable"
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CERT_INFO=$("${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --print-certs "$APK")
          printf '%s\n' "$CERT_INFO"
          if printf '%s\n' "$CERT_INFO" | grep -q 'CN=Android Debug'; then
            echo "Release APK must use a dedicated release signing key, not the Android debug key"
            exit 1
          fi
          EXPECTED_CERT_SHA256="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          test -n "$EXPECTED_CERT_SHA256" || { echo "Missing ANDROID_RELEASE_CERT_SHA256 repository variable"; exit 1; }
          test -n "$ACTUAL_CERT_SHA256" || { echo "Unable to read APK signing certificate fingerprint"; exit 1; }
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release APK certificate fingerprint does not match ANDROID_RELEASE_CERT_SHA256"
            exit 1
          fi

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoscanner-trader-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AutoScanner Trader 0.2.4" \
              --notes "Signed release APK. Package: com.autoscanner.trader; versionCode: 6; versionName: 0.2.4. The build verifies the pinned release certificate fingerprint."
          fi
